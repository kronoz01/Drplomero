<style>
  :root{
    --blueprint: #0e2a47;
    --paper: #eef4fa;
    --paper-dim: #a9c2d8;

  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--blueprint);
    background-image:
      linear-gradient(rgba(180, 210, 235, .10) 1px, transparent 1px),

  .title {
    font-family:'Big Shoulders Display', sans-serif; font-weight:800;
    font-size:clamp(2.2rem, 5vw, 3.5rem); margin-bottom:15px; color:var(--paper);
    letter-spacing: .02em;
  }
  .subtitle {
    font-size:1.1rem; color:var(--paper-dim); max-width:500px; margin-bottom: 35px;
    line-height: 1.6;
  }
  .btn {
    background:rgba(255,255,255,.05); color:var(--paper); padding:16px 28px;
    text-decoration:none; border-radius:6px; font-weight:700; border:1px solid rgba(180, 210, 235, .18);
    transition: 0.2s; text-transform: uppercase; letter-spacing: .05em;
  }
  .btn:hover { background:rgba(255,255,255,.1); transform: translateY(-2px); }
